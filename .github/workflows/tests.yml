name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Lint and offline tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck dash zstd yara
      - name: Run offline test suite
        run: tests/run-tests.sh

  linux-collection:
    name: Live collection smoke test (Linux)
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - name: Quick collection on the runner
        run: sudo ./vestigium.sh --case-id CI-${{ github.run_id }} --quick --skip-yara --output "$RUNNER_TEMP/evidence"
      - name: Verify the evidence package
        run: |
          # The collection runs under sudo, so its output is root-owned. Make it
          # world-readable before globbing and verifying as the runner user.
          sudo chmod -R a+rX "$RUNNER_TEMP/evidence"
          archive="$(ls "$RUNNER_TEMP"/evidence/*.tar.* | grep -v '\.sha256$' | head -n 1)"
          ./vestigium.sh verify "$archive"

  windows-collection:
    name: Live collection smoke test (Windows PowerShell 5.1)
    runs-on: windows-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\\(output|yara-rules)\\' }
          $paths = @($files | ForEach-Object { $_.FullName })
          & .\tests\ps-parse.ps1 @paths   # splat: one argument per file
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Launcher basics
        shell: cmd
        run: |
          call vestigium.cmd version || exit /b 1
          call vestigium.cmd -ListModules || exit /b 1
      - name: Collection on the runner (elevated)
        shell: powershell
        run: |
          .\vestigium.ps1 -CaseId "CI-$env:GITHUB_RUN_ID" -SkipYara -OutputPath "$env:RUNNER_TEMP\evidence"
          # 1 = a step reported warnings on this runner; anything else is a failure.
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0
      - name: Verify the evidence package
        shell: powershell
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\evidence" -Filter *.zip | Select-Object -First 1
          .\vestigium.ps1 verify $zip.FullName
          exit $LASTEXITCODE
      - name: Assert key artifacts were acquired
        shell: powershell
        run: |
          # A green collection can still have silently lost an artifact (warnings
          # do not fail the run), so check the ones that have regressed before.
          $root = Get-ChildItem "$env:RUNNER_TEMP\evidence" -Directory | Select-Object -First 1
          $log = Join-Path $root.FullName '14_Logs\Collection.log'
          Get-Content -LiteralPath $log | Select-String '\[(WARN|ERROR)\]' | ForEach-Object { $_.Line }
          $bad = 0
          foreach ($name in @('MFT', 'LogFile')) {
            $p = Join-Path $root.FullName ('21_FileSystem\' + $name)
            if (-not (Test-Path -LiteralPath $p)) { Write-Host "::error::$name not acquired"; $bad++; continue }
            $buf = New-Object byte[] 4
            $fs = [System.IO.File]::OpenRead($p); [void]$fs.Read($buf, 0, 4); $fs.Dispose()
            $head = [System.Text.Encoding]::ASCII.GetString($buf)
            $want = if ($name -eq 'MFT') { 'FILE' } else { 'RSTR' }
            if ($head -ne $want) { Write-Host "::error::$name does not start with $want (got '$head')"; $bad++ }
            else { Write-Host ("{0}: {1:n0} bytes, signature {2}" -f $name, (Get-Item -LiteralPath $p).Length, $head) }
          }
          foreach ($f in @('findings.json', '15_Hashes\SHA256.csv', '16_Manifest\Manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root.FullName $f))) { Write-Host "::error::$f missing"; $bad++ }
          }
          if (Select-String -LiteralPath $log -Pattern '\[ERROR\] Compression failed' -Quiet) { Write-Host '::error::archive failed'; $bad++ }
          exit $bad
      - name: Upload the collection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-collection-log
          path: ${{ runner.temp }}\evidence\*\14_Logs\Collection.log
          if-no-files-found: ignore
