# Vestigium YARA rule sources - read by setup-tools.sh (Linux) and
# Update-YaraRules.ps1 (Windows).
#
# One source per line:   <name> <git-url> [<ref>]
#
#   name   folder under shared/yara-rules/ (letters, digits, . _ -; "custom" is
#          reserved for the kit's own rules in custom/)
#   url    https://... or git@host:path only
#   ref    optional branch, tag or full 40-character commit SHA; omitted means
#          the repository's default branch
#
# Order is precedence: custom/ always comes first, then these sources top to
# bottom. When two files declare the same rule identifier, the later file is
# skipped (recorded in the build report).
#
# Licences (the repositories are cloned and built locally, never committed to
# this project or redistributed with it):
#   signature-base  Florian Roth / Nextron Systems - Detection Rule License 1.1
#                   (attribution required; see signature-base/LICENSE)
#   rules           Yara-Rules community - GNU GPL-2.0 (see rules/LICENSE)
#
# In-house or private repository: add a line such as
#   acme-intel  git@github.com:acme/yara-intel.git  main
#   acme-intel  https://git.example.org/dfir/yara-intel.git  v2026.09
# Private repositories authenticate with the staging workstation's own git
# credentials (SSH agent, credential helper); nothing is stored here. Put
# rules you want to win identifier clashes in custom/ instead.

signature-base  https://github.com/Neo23x0/signature-base.git
rules           https://github.com/Yara-Rules/rules.git
