# Vestigium YARA exclusions - tune the bundle without editing upstream rules.
# Read by build-yara-rules.py (Linux) and Update-YaraRules.ps1 (Windows).
#
#   file:<glob>   drop whole rule files. The glob is matched (case-insensitive)
#                 against the path relative to shared/yara-rules, with "/"
#                 separators; "*" also matches "/" (file:rules/crypto/* drops
#                 the whole folder).
#   rule:<name>   suppress a rule: exact identifier or glob (* ?), case-
#                 sensitive. Its declaration is rewritten to "private rule" in
#                 the bundle, so rules that reference it still work but it never
#                 reports a match on its own. "global" is kept; rules that are
#                 already private are left alone.
#
# "#" starts a comment. Every exclusion and suppression is recorded in the
# build report; a pattern that matches nothing is reported as "unmatched".
# Use a false-positive scan to find candidates:
#   sudo ./vestigium.sh setup --rules-only --fp-corpus /usr/bin
#
# Nothing below is active by default - detection stays complete. These are
# the capability / crypto-constant rules (Yara-Rules) that produced most hits
# on clean Linux hosts. Uncomment after review. Note: with the default source
# order (signature-base first) rules/crypto/crypto_signatures.yar is currently
# skipped as a whole because one of its identifiers clashes with
# signature-base; its entries then report "unmatched", which is harmless.

# Crypto constants (bignum / prime tables): present in every TLS, SSH and
# crypto library - 137 hits on one clean host.
#rule:Big_Numbers0
#rule:Big_Numbers1
#rule:Big_Numbers3
# Base64 alphabet table: in any binary that encodes or decodes base64.
#rule:BASE64_table
# ChaCha20 constant: in OpenSSL, libsodium, the kernel and most TLS stacks.
#rule:Chacha_256_constant
# Packer heuristic that fires on minified / bundled JavaScript (52 hits).
#rule:possible_includes_base64_packed_functions
# Links against SQLite: browsers, package managers and many desktop apps (25 hits).
#rule:with_sqlite
#
# Coarser alternatives - drop the whole families instead of single rules:
#file:rules/crypto/*
#file:rules/capabilities/*
